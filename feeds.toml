# Fuentes y reglas de Ciber Radar. Para sumar una fuente, agregá un bloque [[feeds]].
#
# region:        ar | latam | mundo (si el título menciona Argentina, pasa a "ar")
# require_cyber: true descarta las notas que no hablan de ciberseguridad
# title_prefix:  solo acepta títulos con ese prefijo y lo quita
# lang:          idioma de los títulos, si no es español
# aggregator:    true marca un agregador. Las fuentes directas van antes para ganar los duplicados

# --- Fuentes directas: Argentina y América Latina ---
[[feeds]]
name = "Segu-Info"
url = "https://blog.segu-info.com.ar/feeds/posts/default"
region = "latam"

[[feeds]]
name = "WeLiveSecurity (ESET)"
url = "https://www.welivesecurity.com/es/rss/feed/"
region = "latam"

[[feeds]]
name = "Segurilatam"
url = "https://www.segurilatam.com/feed"
region = "latam"
require_cyber = true

# --- Fuentes directas: España ---
[[feeds]]
name = "Escudo Digital"
url = "https://www.escudodigital.com/rss/"
region = "mundo"
title_prefix = "ciberseguridad | "

[[feeds]]
name = "Una al Día (Hispasec)"
url = "https://unaaldia.hispasec.com/feed"
region = "mundo"

[[feeds]]
name = "INCIBE-CERT"
url = "https://www.incibe.es/incibe-cert/alerta-temprana/avisos/feed"
